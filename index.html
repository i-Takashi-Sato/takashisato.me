  <style>
    /* 和紙の質感を出すためのSVGフィルターを非表示にする設定 */
    svg#new-card-fx {
      position: absolute;
      width: 0;
      height: 0;
      left: -9999px;
      top: -9999px;
    }

    /* 新しいカード群を包むコンテナ */
    .new-cards-container {
      width: min(1060px, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(22px, 3.2vw, 42px);
      /* 既存の padding-bottom をリセットして調整 */
      padding-bottom: 80px; 
    }

    /* --- 個別のカードデザイン --- */
    .nc-card {
      position: relative;
      display: grid;
      grid-template-columns: minmax(260px, 0.75fr) 1fr;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(10,10,12,.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow: hidden;
      transform: rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
      transition: transform 900ms cubic-bezier(.2,0,.1,1), border-color 600ms cubic-bezier(.16,1,.3,1), background-color 600ms cubic-bezier(.16,1,.3,1), box-shadow 900ms cubic-bezier(.2,0,.1,1);
      will-change: transform;
      box-shadow: 0 40px 90px -30px rgba(0,0,0,.9);
      cursor: pointer;
      text-decoration: none;
      color: rgba(255,255,255,.92);
      text-align: left;
    }

    .nc-card:hover {
      background: rgba(10,10,12,.75);
      border-color: rgba(255,255,255,.16);
      box-shadow: 0 70px 140px -40px rgba(0,0,0,.98);
    }

    .nc-card:focus-visible { outline: 2px solid rgba(255,255,255,.22); outline-offset: 3px; }

    /* 背景エフェクト層 */
    .nc-paper {
      position: absolute;
      inset: -40px;
      opacity: .60;
      filter: url(#paperFibers);
      background:
        radial-gradient(900px 700px at 20% 10%, rgba(255,255,255,.07), transparent 60%),
        radial-gradient(800px 700px at 90% 80%, rgba(255,255,255,.05), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,.03), rgba(0,0,0,0));
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 1;
    }

    .nc-metal {
      position: absolute;
      inset: -80px;
      opacity: 0;
      background:
        conic-gradient(from 210deg at 50% 50%, rgba(255,255,255,.0), rgba(255,255,255,.10), rgba(255,255,255,.0), rgba(255,255,255,.18), rgba(255,255,255,.0)),
        radial-gradient(900px 520px at 50% 40%, rgba(255,255,255,.10), transparent 60%),
        radial-gradient(800px 600px at 30% 90%, rgba(255,255,255,.06), transparent 62%);
      filter: contrast(1.2) saturate(.9);
      mix-blend-mode: color-dodge;
      -webkit-mask-image: radial-gradient(var(--spot,420px) circle at var(--x,50%) var(--y,50%), #000 0%, transparent 72%);
      mask-image: radial-gradient(var(--spot,420px) circle at var(--x,50%) var(--y,50%), #000 0%, transparent 72%);
      transition: opacity 450ms cubic-bezier(.16,1,.3,1);
      pointer-events: none;
      z-index: 2;
    }

    .nc-glare {
      position: absolute;
      inset: 0;
      opacity: 0;
      background: radial-gradient(var(--spot2,520px) circle at var(--x,50%) var(--y,50%), rgba(255,255,255,.10), transparent 62%);
      mix-blend-mode: overlay;
      transition: opacity 350ms cubic-bezier(.16,1,.3,1);
      pointer-events: none;
      z-index: 3;
    }

    .nc-card:hover .nc-metal { opacity: .80; }
    .nc-card:hover .nc-glare { opacity: 1; }

    /* 左側（メイン情報） */
    .nc-main {
      padding: clamp(22px, 3vw, 44px);
      position: relative;
      z-index: 5;
    }

    .nc-part { font-family: 'Inter', sans-serif; font-size: .68rem; letter-spacing: .28em; text-transform: uppercase; font-weight: 600; color: rgba(255,255,255,.86); }
    .nc-rule { height: 1px; width: 36px; background: rgba(255,255,255,.10); }
    .nc-label { font-family: 'Inter', sans-serif; font-size: .68rem; letter-spacing: .26em; text-transform: uppercase; color: rgba(255,255,255,.32); }

    .nc-main h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      line-height: 1.02;
      letter-spacing: -.02em;
      font-size: clamp(2.1rem, 4.8vw, 3.7rem);
      margin: 0 0 16px 0;
      text-shadow: 0 12px 28px rgba(0,0,0,.45);
      color: rgba(255,255,255,.92);
      text-transform: none; /* 既存CSSのリセット */
    }
    .nc-main h2 strong { font-weight: 400; color: rgba(255,255,255,.72); }

      margin: 0;
    }

    }
