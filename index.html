<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>THE WASHI SCAN</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&display=swap" rel="stylesheet">

<style>
:root{
  --phi:1.61803398875;

  --bg:#050507;
  --ink:rgba(255,255,255,.92);
  --muted:rgba(255,255,255,.62);
  --dim:rgba(255,255,255,.32);
  --line:rgba(255,255,255,.10);

  --card:rgba(10,10,12,.55);
  --card2:rgba(10,10,12,.75);

  --ease:cubic-bezier(.16,1,.3,1);
  --ease2:cubic-bezier(.2,0,.1,1);

  --serif:"Cormorant Garamond",serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ================= background ================= */

svg#fx{position:absolute;width:0;height:0;left:-9999px;top:-9999px}

.bg{
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(1200px 800px at 50% -10%, rgba(255,255,255,.08), transparent 65%),
    radial-gradient(900px 700px at 20% 110%, rgba(255,255,255,.05), transparent 60%),
    linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.55));
}

.bg::before{
  content:"";
  position:absolute;
  inset:-40px;
  background:
    radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,.14), transparent 60%),
    radial-gradient(1px 1px at 80% 30%, rgba(255,255,255,.10), transparent 60%),
    radial-gradient(1px 1px at 30% 90%, rgba(255,255,255,.08), transparent 60%);
  opacity:.55;
  filter:url(#paperFibers);
}

.bg::after{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 4px);
  mix-blend-mode:overlay;
  opacity:.22;
  pointer-events:none;
}

/* ================= layout ================= */

.wrap{
  --header-h:72px;
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:
    calc(clamp(28px,4vw,56px) + var(--header-h))
    18px
    clamp(28px,4vw,56px);
}

.stack{
  width:min(1060px,100%);
  display:flex;
  flex-direction:column;
  gap:clamp(22px,3.2vw,42px);
}

/* ================= card ================= */

.card{
  position:relative;
  display:grid;
  grid-template-columns:minmax(260px,0.75fr) 1fr;
  border:1px solid var(--line);
  background:var(--card);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  overflow:hidden;
  border-radius:22px;

  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:
    transform 900ms var(--ease2),
    border-color 600ms var(--ease),
    background-color 600ms var(--ease),
    box-shadow 900ms var(--ease2);

  will-change:transform;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9);
  cursor:pointer;
}

.card:hover{
  background:var(--card2);
  border-color:rgba(255,255,255,.16);
  box-shadow:0 70px 140px -40px rgba(0,0,0,.98);
}

.paper{
  position:absolute;
  inset:-40px;
  opacity:.6;
  filter:url(#paperFibers);
  background:
    radial-gradient(900px 700px at 20% 10%, rgba(255,255,255,.07), transparent 60%),
    radial-gradient(800px 700px at 90% 80%, rgba(255,255,255,.05), transparent 55%);
  mix-blend-mode:soft-light;
  pointer-events:none;
  z-index:1;
}

.metal{
  position:absolute;
  inset:-80px;
  opacity:0;
  background:
    conic-gradient(from 210deg at 50% 50%,
      rgba(255,255,255,0),
      rgba(255,255,255,.12),
      rgba(255,255,255,0));
  mix-blend-mode:color-dodge;
  -webkit-mask-image:
    radial-gradient(420px circle at var(--x,50%) var(--y,50%), #000 0%, transparent 72%);
  transition:opacity 450ms var(--ease);
  pointer-events:none;
  z-index:2;
}

.glare{
  position:absolute;
  inset:0;
  opacity:0;
  background:
    radial-gradient(520px circle at var(--x,50%) var(--y,50%), rgba(255,255,255,.12), transparent 62%);
  mix-blend-mode:overlay;
  transition:opacity 350ms var(--ease);
  pointer-events:none;
  z-index:3;
}

.card:hover .metal{opacity:.8}
.card:hover .glare{opacity:1}

/* ================= content ================= */

.main{
  padding:clamp(26px,3.2vw,46px);
  display:flex;
  flex-direction:column;
  z-index:5;
}

.meta{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:clamp(16px,2.1vw,26px);
}

.part{
  font-size:.68rem;
  letter-spacing:.28em;
  text-transform:uppercase;
  font-weight:600;
}

.rule{
  width:36px;
  height:1px;
  background:var(--line);
}

.label{
  font-size:.68rem;
  letter-spacing:.26em;
  text-transform:uppercase;
  color:var(--dim);
}

h2{
  font-family:var(--serif);
  font-weight:300;
  line-height:1.02;
  letter-spacing:-.02em;
  font-size:clamp(2.1rem,4.8vw,3.7rem);
  margin-bottom:calc(16px / var(--phi));
  max-width:18ch;
}

.sub{
  font-family:var(--serif);
  font-style:italic;
  color:var(--muted);
  font-size:clamp(1.02rem,1.55vw,1.2rem);
  line-height:calc(var(--phi) + .06);
  max-width:56ch;
}

/* ================= footer ================= */

.foot{
  margin-top:clamp(22px,2.8vw,38px);
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.tag{
  font-size:.58rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:rgba(255,255,255,.38);
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.02);
  padding:10px 14px;
  border-radius:999px;
}

.actions{
  margin-left:auto;
  display:flex;
  gap:10px;
}

.cta{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:11px 14px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.10);
  font-size:.62rem;
  letter-spacing:.28em;
  text-transform:uppercase;
  background:rgba(255,255,255,.03);
  color:rgba(255,255,255,.85);
  text-decoration:none;
}

.cta.primary{
  background:rgba(255,255,255,.09);
}

/* ================= aside ================= */

.aside{
  border-left:1px solid var(--line);
  background:rgba(0,0,0,.26);
  padding:clamp(22px,2.8vw,40px);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  z-index:5;
}

.klabel{
  font-size:.56rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:rgba(255,255,255,.38);
  margin-bottom:10px;
}

.quote{
  font-family:var(--serif);
  font-style:italic;
  color:rgba(255,255,255,.55);
  line-height:1.7;
}

.qmeta{
  border-top:1px solid var(--line);
  padding-top:14px;
  font-size:.56rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:rgba(255,255,255,.38);
}

/* ================= responsive ================= */

@media (max-width:900px){
  .card{grid-template-columns:1fr}
  .aside{border-left:none;border-top:1px solid var(--line)}
  .actions{margin-left:0;width:100%}
}

@media (max-width:520px){
  .main,.aside{padding:22px}
  .cta{width:100%;justify-content:center}
}
</style>
</head>

<body>
<svg id="fx" xmlns="http://www.w3.org/2000/svg">
  <filter id="paperFibers" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="9"/>
  </filter>
</svg>

<div class="bg"></div>

<main class="wrap">
  <div class="stack">

    <!-- Part I -->
    <article class="card" data-href="/papers/part1.html">
      <div class="paper"></div><div class="metal"></div><div class="glare"></div>
      <section class="main">
        <div class="meta"><span class="part">Part I</span><span class="rule"></span><span class="label">Grand Design</span></div>
        <h2>Part I: The Cold<br>Genesis</h2>
        <p class="sub">“To preserve the human, we must engineer the friction of thought.”</p>
        <div class="foot">
          <span class="tag">AI governance</span>
          <span class="tag">workflow-centric oversight</span>
          <span class="tag">human-in-the-loop</span>
          <div class="actions">
            <a class="cta primary" href="/papers/part1.html">Open Part</a>
            <a class="cta" href="/pdf/part1.pdf">Open PDF</a>
          </div>
        </div>
      </section>
      <aside class="aside">
        <div>
          <span class="klabel">Keywords</span>
          <p class="quote">AI governance · workflow-centric oversight · human-in-the-loop</p>
        </div>
        <div class="qmeta">Selected Works 2025–2026</div>
      </aside>
    </article>

    <!-- Part II / III は同構造 -->

  </div>
</main>
</body>
</html>
