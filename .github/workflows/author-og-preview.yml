name: Author social card preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/generate_og.py'
      - '.github/workflows/author-og-preview.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement tools/requirements.txt
      - name: Render public preview
        run: |
          python - <<'PY'
          from tools.generate_og import render_archive_card
          from pathlib import Path
          import base64
          from hashlib import sha256
          path = Path("assets/og/archive.jpg")
          render_archive_card().save(path, "JPEG", quality=86, optimize=True, progressive=True, subsampling=0)
          data = path.read_bytes()
          assert len(data) <= 180000
          print("ARCHIVE_JPEG_SHA256:" + sha256(data).hexdigest())
          encoded = base64.b64encode(data).decode("ascii")
          for offset in range(0, len(encoded), 4000):
              print("ARCHIVE_JPEG_CHUNK:" + encoded[offset:offset+4000])
          print("ARCHIVE_JPEG_END")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: author-og-preview
          path: assets/og/archive.jpg
          retention-days: 7
