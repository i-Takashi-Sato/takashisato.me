name: Apply CSP Critical Style Fix

on:
  push:
    branches:
      - v6.18.1-csp-critical-css

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v6.18.1-csp-critical-css
          fetch-depth: 0
      - name: Remove CSP-blocked inline critical stylesheet path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          layout = Path('src/archive/layout.py')
          text = layout.read_text(encoding='utf-8')
          old = '    critical_css = (ROOT / "assets/critical.css").read_text(encoding="utf-8").strip()\n'
          if old not in text:
              raise SystemExit('layout critical_css loader not found')
          text = text.replace(old, '')
          old = '          <style data-critical>{critical_css}</style>\n'
          if old not in text:
              raise SystemExit('layout inline critical style not found')
          text = text.replace(old, '')
          layout.write_text(text, encoding='utf-8')

          assets = Path('tools/build_assets.py')
          text = assets.read_text(encoding='utf-8')
          old = '    critical = (ROOT / "src/styles/critical.css").read_text(encoding="utf-8").rstrip() + "\\n"\n    (ROOT / "assets/critical.css").write_text(critical, encoding="utf-8")\n'
          if old not in text:
              raise SystemExit('critical asset build block not found')
          text = text.replace(old, '')
          assets.write_text(text, encoding='utf-8')

          site = Path('tools/build_site.py')
          text = site.read_text(encoding='utf-8')
          old = 'Build output remains one shared stylesheet and one script, with first-viewport rules inlined for immediate paint.'
          new = 'Build output remains one shared stylesheet and one script; the stylesheet is preloaded and applied without an inline style block.'
          if old not in text:
              raise SystemExit('colophon inline-style statement not found')
          text = text.replace(old, new)
          site.write_text(text, encoding='utf-8')
          PY

          rm -f src/styles/critical.css assets/critical.css
          python tools/build_site.py

          if grep -R -n '<style data-critical>' index.html about.html colophon.html privacy.html security.html 404.html papers demo; then
            echo 'Inline critical style remains in generated output.' >&2
            exit 1
          fi
          test ! -e src/styles/critical.css
          test ! -e assets/critical.css
      - name: Commit deterministic source and generated output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'v6.18.1: remove CSP-blocked inline critical stylesheet [skip ci]'
          git push origin HEAD:v6.18.1-csp-critical-css
