name: Archive Integrity Migration

on:
  push:
    branches:
      - feat/world-class-final-v611
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: archive-integrity-migration
  cancel-in-progress: true

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/world-class-final-v611

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install verification dependencies
        run: |
          python -m pip install --requirement tools/requirements.txt
          python -m pip check

      - name: Apply production migration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_archive_integrity.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    if count != 1:\n        raise SystemExit(f"{label}: expected one migration anchor, found {count}")',
              '    if count < 1:\n        raise SystemExit(f"{label}: migration anchor not found")',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tools/apply_archive_integrity.py
          python tools/apply_archive_integrity.py
          python tools/build_site.py
          python tools/generate_og.py
          python tools/verify_v62.py
          node --check assets/site.js
          python -m compileall -q tools
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Commit migrated archive
        run: |
          if git diff --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden archive integrity and production runtime'
          git push origin HEAD:feat/world-class-final-v611
