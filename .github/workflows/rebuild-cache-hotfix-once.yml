name: Rebuild Cache Hotfix Once

on:
  push:
    branches:
      - fix/asset-cache-v6101

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild deterministic archive outputs
        run: python tools/build_site.py
      - name: Remove one-shot workflow
        run: rm .github/workflows/rebuild-cache-hotfix-once.yml
      - name: Commit rebuilt outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Rebuild archive with 6.10.2 runtime cache key"
          git push origin HEAD:fix/asset-cache-v6101
