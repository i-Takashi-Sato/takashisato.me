# Temporary release-branch build only. Remove before merge.
name: Generate v6.3 staged outputs
on:
  push:
    branches: [release/v6.3-20261128]
    paths: ['.github/workflows/stage-v63-generated.yml']
permissions:
  contents: read
jobs:
  generate:
    if: github.repository == 'i-Takashi-Sato/takashisato.me' && github.ref == 'refs/heads/release/v6.3-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Build and verify without deployment
        run: |
          set -euo pipefail
          python -m pip install --requirement tools/requirements.txt
          python tools/build_site.py
          python tools/generate_og.py
          python tools/verify_v63.py
          python tools/test_verify_live.py
          python tools/test_indexnow.py
          python tools/release_scope.py --self-test
          python tools/release_scope.py --base fab0511aa5ab9d4294160a0d075ee61808e53257 | grep -x scope=full
      - name: Commit only deterministic build output to this draft branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "release/v6.3-20261128"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html about.html papers/ publications/ publications.json colophon.html privacy.html security.html 404.html demo/ research-index.json sitemap.xml feed.xml llms.txt humans.txt robots.txt site.webmanifest citations/v6.3/ assets/og/ assets/site.css assets/site.js
          git diff --exit-code
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git ls-files --others --exclude-standard
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m "Generate v6.3 public archive from verified source"
          git push origin HEAD:refs/heads/release/v6.3-20261128
