name: Apply CSP Asset QA
on:
  push:
    branches: [v6.18.1-csp-pr]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v6.18.1-csp-pr
          fetch-depth: 0
      - run: python tools/_fix_csp_asset_qa.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "qa: remove retired critical stylesheet asset checks [skip ci]"
          git push origin HEAD:v6.18.1-csp-pr
