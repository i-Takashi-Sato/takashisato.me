name: v7 branch generated-output sync

on:
  push:
    branches:
      - design/v7-zero-base

permissions:
  contents: write

concurrency:
  group: v7-output-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/v7-zero-base
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Rebuild generated web assets
        run: python tools/build_assets.py
      - name: Commit generated output if needed
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site.css assets/site.js
          git commit -m "chore: reconcile v7 generated web assets"
          git push origin HEAD:design/v7-zero-base
