name: v7 branch generated-output sync

on:
  push:
    branches:
      - design/v7-zero-base

permissions:
  contents: write

concurrency:
  group: v7-output-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/v7-zero-base
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install pinned build dependencies
        run: |
          python -m pip install --requirement tools/requirements.txt
          python -m pip check
      - name: Rebuild deterministic outputs
        run: |
          python tools/build_site.py
          python tools/generate_og.py
      - name: Commit generated output if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated output already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: reconcile v7 generated archive outputs"
          git push origin HEAD:design/v7-zero-base
