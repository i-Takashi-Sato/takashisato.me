name: One-shot v6.14 performance sync

on:
  push:
    branches:
      - feat/final-architecture-seo-art

permissions:
  contents: write

concurrency:
  group: v614-performance-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/final-architecture-seo-art
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement tools/requirements.txt
      - name: Compile runtime assets
        run: |
          python tools/build_assets.py
          node --check assets/site.js
          python tools/verify_v62.py
      - name: Commit synchronized runtime
        run: |
          rm -f .github/workflows/v614-performance-sync-once.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: sync first-viewport performance layer'
          git push origin HEAD:feat/final-architecture-seo-art
