name: v6.11 Branch Builder

on:
  push:
    branches:
      - feat/world-class-final-v611
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v611-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/world-class-final-v611

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install archive verification dependencies
        run: |
          python -m pip install --requirement tools/requirements.txt
          python -m pip check

      - name: Apply v6.11 migration and rebuild deterministic outputs
        run: |
          python tools/apply_v611.py
          python tools/build_site.py
          python tools/generate_og.py
          python tools/verify_v62.py
          python -m compileall -q tools
          node --check assets/archive-v62.js
          node --check scripts/archive-v611.js
          node --check assets/site-analytics.js

      - name: Commit generated v6.11 archive
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build v6.11 final archive refinement'
          git push origin HEAD:feat/world-class-final-v611
