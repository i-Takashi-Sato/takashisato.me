name: Temporary final design comparison
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  comparison:
    if: github.head_ref == 'final-design-release-20261128' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a311ddf0b344933af9236541e91269c7593c0e48
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 4174 --bind 127.0.0.1 --directory baseline >/tmp/base-http.log 2>&1 &
          python -m http.server 4173 --bind 127.0.0.1 --directory candidate >/tmp/head-http.log 2>&1 &
          for port in 4173 4174; do
            for i in {1..30}; do
              if curl --fail --silent "http://127.0.0.1:$port/" >/dev/null; then break; fi
              sleep 1
            done
            curl --fail --silent "http://127.0.0.1:$port/" >/dev/null
          done
      - name: Compare fourteen pages and check author typography
        run: |
          python - <<'PY'
          import base64, json
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          routes = {"home": "/", "publications": "/publications/", "papers": "/papers/",
                    "about": "/about.html", "part1": "/papers/part1.html",
                    "part2": "/papers/part2.html", "part3": "/papers/part3.html",
                    "privacy": "/privacy.html", "security": "/security.html",
                    "colophon": "/colophon.html", "404": "/404.html",
                    "legacy-index": "/demo/", "legacy-part1": "/demo/altrion-part1.html",
                    "legacy-part2": "/demo/altrion-part2.html"}
          out = Path("comparison")
          out.mkdir()
          report = []
          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              for side, port in (("before", 4174), ("after", 4173)):
                  for width, height in ((390, 844), (1440, 900)):
                      context = browser.new_context(viewport={"width": width, "height": height}, reduced_motion="reduce")
                      page = context.new_page()
                      for name, route in routes.items():
                          page.goto(f"http://127.0.0.1:{port}{route}", wait_until="networkidle")
                          page.evaluate("document.fonts.ready")
                          page.evaluate("document.querySelectorAll('[data-reveal]').forEach(x => x.classList.add('is-visible'))")
                          metrics = page.evaluate("() => ({viewport: innerWidth, scrollWidth: document.documentElement.scrollWidth})")
                          report.append({"side": side, "page": name, "width": width, **metrics})
                          if metrics["scrollWidth"] > width + 3:
                              raise ValueError(f"{side}/{name}/{width}: horizontal overflow: {metrics}")
                          page.screenshot(path=str(out / f"{name}-{width}-{side}.png"), full_page=True)
                          if side == "after" and name in ("home", "about"):
                              target = page.locator(".identity-thesis [lang=ja]" if name == "home" else ".portrait-name [lang=ja]")
                              value = target.evaluate("""e => {const s=getComputedStyle(e); return {text:e.textContent, family:s.fontFamily,
                                  weight:s.fontWeight, spacing:parseFloat(s.letterSpacing), size:parseFloat(s.fontSize),
                                  line:parseFloat(s.lineHeight), features:s.fontFeatureSettings, color:s.color}}""")
                              if value["text"].strip() != "佐藤貴士" or not value["family"].startswith("TSName") or value["weight"] != "500":
                                  raise ValueError(f"Name typography mismatch: {value}")
                              if abs(value["spacing"]/value["size"]-.18) > .005 or abs(value["line"]/value["size"]-1.4) > .005:
                                  raise ValueError(f"Name spacing mismatch: {value}")
                              loaded = page.evaluate("""async () => ({name: (await document.fonts.load('500 16px TSName','佐藤貴士')).map(x=>x.status),
                                  other: (await document.fonts.load('500 16px TSName','あ')).length})""")
                              if loaded["name"] != ["loaded"] or loaded["other"] != 0:
                                  raise ValueError(f"Name font coverage mismatch: {loaded}")
                              print(f"NAME {width} {name}: {json.dumps(value,ensure_ascii=False)} {loaded}", flush=True)
                              page.reload(wait_until="networkidle")
                              page.evaluate("document.fonts.ready")
                              page.evaluate("document.querySelectorAll('[data-reveal]').forEach(x => x.classList.add('is-visible'))")
                              page.screenshot(path=str(out / f"{name}-{width}-after-warm.png"), full_page=True)
                      page.goto(f"http://127.0.0.1:{port}/papers/#japanese", wait_until="networkidle")
                      page.evaluate("window.scrollBy(0,300)")
                      page.wait_for_timeout(100)
                      page.screenshot(path=str(out / f"header-{width}-{side}.png"))
                      crop = page.locator(".site-header").screenshot()
                      print(f"HEADER_{side}_{width}=" + base64.b64encode(crop).decode(), flush=True)
                      context.close()
              browser.close()
          (out / "geometry.json").write_text(json.dumps(report, indent=2)+"\n")
          print(f"Compared {len(report)} before/after page-width combinations", flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final-before-after-390-1440
          path: comparison
          if-no-files-found: error
          retention-days: 14
  baseline-webkit:
    if: github.head_ref == 'final-design-release-20261128' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a311ddf0b344933af9236541e91269c7593c0e48
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps webkit
      - run: |
          python -m http.server 4174 --bind 127.0.0.1 --directory baseline >/tmp/base-http.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4174/ >/dev/null
      - name: Repeat published baseline without relaxing the geometry test
        run: |
          mkdir -p baseline-reports
          for n in 1 2; do
            set +e
            VISUAL_BASE_URL=http://127.0.0.1:4174 python candidate/tools/reading_resilience.py --engine webkit
            status=$?
            set -e
            echo "BASELINE_WEBKIT_ATTEMPT_${n}_EXIT=${status}"
            if [ -d artifacts/cross-engine/resilience/webkit ]; then
              mv artifacts/cross-engine/resilience/webkit "baseline-reports/attempt-$n"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: original-webkit-repeat
          path: baseline-reports
          if-no-files-found: error
          retention-days: 14
