name: v6.18.1 Font Priority Experiment

on:
  push:
    branches:
      - v6.18.1-font-priority

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[font-priority-built]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v6.18.1-font-priority
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Prioritize the display font used by the LCP title register
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/archive/layout.py')
          text = path.read_text()
          old = '''          <link rel="preload" href="/assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>\n          <link rel="preload" href="/assets/fonts/Newsreader-Variable.woff2" as="font" type="font/woff2" crossorigin>'''
          new = '''          <link rel="preload" href="/assets/fonts/Newsreader-Variable.woff2" as="font" type="font/woff2" crossorigin fetchpriority="high">\n          <link rel="preload" href="/assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin fetchpriority="low">'''
          if old not in text:
              raise SystemExit('Expected preload block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python tools/build_site.py
      - name: Commit experiment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/archive/layout.py index.html papers/index.html papers/part1.html papers/part2.html papers/part3.html about.html colophon.html privacy.html security.html 404.html demo/index.html demo/altrion-part1.html demo/altrion-part2.html
          git commit -m 'perf: prioritize display font for first-view LCP [font-priority-built]'
          git push origin HEAD:v6.18.1-font-priority
