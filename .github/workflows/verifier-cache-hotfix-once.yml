name: Verifier Cache Hotfix Once

on:
  push:
    branches:
      - fix/asset-cache-v6101

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize verifier asset version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/verify_v62.py')
          text = p.read_text(encoding='utf-8')
          old = 'ASSET_VERSION = "6.5.1"'
          new = 'ASSET_VERSION = "6.10.2"'
          if old not in text:
              raise SystemExit('expected verifier asset version not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/verifier-cache-hotfix-once.yml
      - name: Commit verifier sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize verifier with 6.10.2 asset contract"
          git push origin HEAD:fix/asset-cache-v6101
