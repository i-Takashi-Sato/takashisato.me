name: One-shot v6.13 rebuild

on:
  push:
    branches:
      - design/editorial-refinement-v613

permissions:
  contents: write

concurrency:
  group: v613-rebuild-once
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/editorial-refinement-v613
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install verification dependencies
        run: python -m pip install --requirement tools/requirements.txt

      - name: Rebuild archive
        run: |
          python tools/build_site.py
          python tools/generate_og.py
          python tools/verify_v62.py
          python -m compileall -q tools
          node --check assets/site.js
          grep -R --line-number 'site.js?v=6.13.0" defer' index.html papers/index.html papers/part1.html papers/part2.html papers/part3.html about.html
          ! grep -R --line-number -E 'content:[[:space:]]*"(序|破|急)"|Jo / Ha / Kyu' assets/site.css

      - name: Commit rebuilt output
        run: |
          rm -f .github/workflows/v613-rebuild-once.yml
          rm -f .github/workflows/v613-finish-once.yml
          rm -f docs/.v613-finish-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild v6.13 final archive'
          git push origin HEAD:design/editorial-refinement-v613
