# Temporary branch-only deterministic build. Remove before merge.
name: Generate legacy contrast repair
on:
  push:
    branches: [fix/legacy-notice-contrast-20261128]
    paths: ['.github/workflows/stage-legacy-contrast.yml']
permissions:
  contents: read
jobs:
  generate:
    if: github.repository == 'i-Takashi-Sato/takashisato.me' && github.ref == 'refs/heads/fix/legacy-notice-contrast-20261128'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Rebuild and verify without deployment
        run: |
          set -euo pipefail
          python -m pip install --requirement tools/requirements.txt
          python tools/build_site.py
          python tools/generate_og.py
          python tools/verify_v63.py
          python tools/test_verify_live.py
          python tools/release_scope.py --base 6789e0946718b4cddc532bc7860536729564a934 | grep -x scope=full
      - name: Commit only generated HTML and immutable CSS to this branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "fix/legacy-notice-contrast-20261128"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' 'assets/site*.css'
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate archive with readable legacy notices"
          git push origin HEAD:refs/heads/fix/legacy-notice-contrast-20261128
