name: v6.18 Terminal Precision

on:
  push:
    branches:
      - v6.18-terminal-precision

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v6.18-terminal-precision

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Apply source refinements
        run: python tools/v618_refine.py

      - name: Rebuild deterministic output
        run: python tools/build_site.py

      - name: Verify source and runtime contracts
        run: |
          python -m py_compile src/archive/model.py tools/build_site.py tools/visual_smoke.py
          python tools/verify_v62.py
          css_bytes=$(wc -c < assets/site.css)
          js_bytes=$(wc -c < assets/site.js)
          echo "site.css=${css_bytes}"
          echo "site.js=${js_bytes}"
          test "$css_bytes" -lt 100000

      - name: Commit source and generated output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/archive/model.py src/styles/motion.css tools/build_site.py tools/visual_smoke.py assets/site.css assets/site.js assets/critical.css index.html papers/index.html papers/part1.html papers/part2.html papers/part3.html about.html colophon.html privacy.html security.html 404.html demo/index.html demo/altrion-part1.html demo/altrion-part2.html research-index.json sitemap.xml robots.txt llms.txt humans.txt site.webmanifest .well-known/security.txt
          git commit -m 'v6.18: terminal precision and archival orientation [v618-refine]'
          git push origin HEAD:v6.18-terminal-precision
