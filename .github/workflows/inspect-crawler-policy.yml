name: Inspect public crawler policy
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-crawler-policy.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Capture public robots response
        run: |
          curl --fail --silent --show-error --max-time 30 --max-filesize 65536 -H 'Cache-Control: no-cache' -H 'User-Agent: ProperEndingIndex-ReleaseAudit/1.0' -D /tmp/robots-headers.txt https://takashisato.me/robots.txt -o /tmp/public-robots.txt
          python3 -c 'from pathlib import Path; print(repr(Path("/tmp/robots-headers.txt").read_bytes())); print(repr(Path("/tmp/public-robots.txt").read_bytes()))'
