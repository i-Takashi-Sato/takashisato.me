name: Temporary platinum assets sync
on:
  push:
    branches:
      - maintenance/platinum-og-metadata-20261124
    paths:
      - tools/generate_og.py
      - .github/workflows/temporary-platinum-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout changes
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate visual assets from canonical source
        run: |
          python -m pip install pillow
          python tools/generate_og.py
      - name: Commit only generated visual assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og/home.jpg assets/og/papers.jpg assets/og/about.jpg assets/og/part1.jpg assets/og/part2.jpg assets/og/part3.jpg
          git add android-chrome-192x192.png android-chrome-512x512.png apple-touch-icon.png favicon-16x16.png favicon-32x32.png favicon-16x16-dark.png favicon-32x32-dark.png favicon.ico
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate platinum OG cards and icon assets"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
