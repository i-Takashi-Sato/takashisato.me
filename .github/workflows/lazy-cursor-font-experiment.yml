name: Lazy Cursor Font Experiment

on:
  push:
    branches:
      - v6.18-lazy-cursor-font

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v6.18-lazy-cursor-font
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Defer decorative cursor font until pointer use
        run: python tools/lazy_cursor_font_refine.py
      - name: Rebuild deterministic output
        run: python tools/build_site.py
      - name: Enforce runtime budget
        run: |
          css_bytes=$(wc -c < assets/site.css)
          js_bytes=$(wc -c < assets/site.js)
          echo "site.css=${css_bytes}"
          echo "site.js=${js_bytes}"
          test "$css_bytes" -lt 100000
          python -m py_compile tools/visual_smoke.py
      - name: Commit source and generated output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/base.css src/scripts/core.js assets/site.css assets/site.js index.html papers/index.html papers/part1.html papers/part2.html papers/part3.html about.html colophon.html privacy.html security.html 404.html demo/index.html demo/altrion-part1.html demo/altrion-part2.html
          git commit -m 'perf: defer decorative cursor font until pointer use [lazy-cursor-font]'
          git push origin HEAD:v6.18-lazy-cursor-font
