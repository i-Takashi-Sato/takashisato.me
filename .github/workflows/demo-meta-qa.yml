name: Demo Metadata QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'demo/index.html'
      - 'demo/altrion-part1.html'
      - 'demo/altrion-part2.html'
      - '.github/workflows/demo-meta-qa.yml'

permissions:
  contents: read

jobs:
  check-demo-meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check demo metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pages = {
              'demo/index.html': {
                  'title': 'Instruments — The Proper Ending Index',
                  'description': 'Two browser instruments for AI governance: structured friction and pre-abuse collapse. Part III remains a paper route.',
                  'url': 'https://takashisato.me/demo/',
                  'image': 'https://takashisato.me/assets/og/papers.jpg',
              },
              'demo/altrion-part1.html': {
                  'title': 'Structured Friction Instrument — The Proper Ending Index',
                  'description': 'Interactive Part I instrument for workflow-centric AI governance, structured friction, intervention probability, and auditable decision records.',
                  'url': 'https://takashisato.me/demo/altrion-part1.html',
                  'image': 'https://takashisato.me/assets/og/part1.jpg',
              },
              'demo/altrion-part2.html': {
                  'title': 'Pre-abuse Collapse Instrument — The Proper Ending Index',
                  'description': 'Interactive Part II instrument for pre-abuse failure, organizational entropy, cognitive offload, liability hardening, and legibility capture.',
                  'url': 'https://takashisato.me/demo/altrion-part2.html',
                  'image': 'https://takashisato.me/assets/og/part2.jpg',
              },
          }

          failures = []
          for path, meta in pages.items():
              html = Path(path).read_text(encoding='utf-8')
              expected = [
                  f'<title>{meta["title"]}</title>',
                  f'<meta name="description" content="{meta["description"]}" />',
                  f'<link rel="canonical" href="{meta["url"]}" />',
                  '<meta property="og:type" content="website" />',
                  f'<meta property="og:title" content="{meta["title"]}" />',
                  f'<meta property="og:description" content="{meta["description"]}" />',
                  f'<meta property="og:url" content="{meta["url"]}" />',
                  f'<meta property="og:image" content="{meta["image"]}" />',
                  '<meta property="og:image:width" content="1200" />',
                  '<meta property="og:image:height" content="630" />',
                  '<meta name="twitter:card" content="summary_large_image" />',
                  f'<meta name="twitter:title" content="{meta["title"]}" />',
                  f'<meta name="twitter:description" content="{meta["description"]}" />',
                  f'<meta name="twitter:image" content="{meta["image"]}" />',
              ]
              for tag in expected:
                  count = html.count(tag)
                  if count != 1:
                      failures.append(f'{path}: expected one `{tag}`, found {count}')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          print('Demo metadata contract OK for 3 instrument routes.')
          PY
