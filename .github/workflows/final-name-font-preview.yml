name: Temporary author font provenance preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'final-design-release-20261128' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check fonttools==4.63.0 Brotli==1.2.0
      - run: python tools/build_name_font.py
