name: HTML Semantics Migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/world-class-final-v611

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install verification dependencies
        run: |
          python -m pip install --requirement tools/requirements.txt
          python -m pip check

      - name: Apply, rebuild, and verify
        run: |
          python tools/apply_html_semantics.py
          python tools/build_site.py
          python tools/generate_og.py
          python tools/verify_v62.py
          node --check assets/site.js
          python -m compileall -q tools
          find tools -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Commit semantic corrections
        run: |
          if git diff --quiet; then
            echo 'No semantic changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix semantic HTML and table scope'
          git push origin HEAD:feat/world-class-final-v611
