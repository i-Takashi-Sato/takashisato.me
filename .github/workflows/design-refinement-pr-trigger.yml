name: Trigger v6.13 editorial refinement

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'design/editorial-refinement-v613'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out design branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/editorial-refinement-v613
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install verification dependencies
        run: python -m pip install --requirement tools/requirements.txt

      - name: Execute embedded refinement migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/design-refinement-once.yml').read_text(encoding='utf-8')
          start = source.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = source.index("\n          PY\n", start)
          code = textwrap.dedent(source[start:end])
          exec(compile(code, 'v613-refinement', 'exec'), {'__name__': '__main__'})
          PY

      - name: Rebuild and verify
        run: |
          python tools/build_site.py
          python tools/generate_og.py
          python tools/verify_v62.py
          python -m compileall -q tools
          node --check assets/site.js
          ! grep -R --line-number -E 'content:[[:space:]]*"(序|破|急)"|Jo / Ha / Kyu' assets/site.css
          grep -R --line-number 'site.css?v=6.13.0' index.html papers/index.html papers/part1.html papers/part2.html papers/part3.html about.html

      - name: Commit refined production output
        run: |
          rm -f .github/workflows/design-refinement-once.yml .github/workflows/design-refinement-pr-trigger.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine archive visual grammar v6.13'
          git push origin HEAD:design/editorial-refinement-v613
