name: One-shot remove visible Japanese surface

on:
  push:
    branches:
      - fix/remove-japanese-surface

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/remove-japanese-surface
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install verification dependencies
        run: python -m pip install --requirement tools/requirements.txt

      - name: Remove display Japanese and keep factual identity
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tools/build_site.py')
          s = p.read_text(encoding='utf-8')
          bad = '                <p class="author-identity" lang="ja">佐藤貴士　札幌</p>\n'
          if bad not in s:
              raise SystemExit('author Japanese display line not found')
          s = s.replace(bad, '', 1)
          old = '''                  <div><dt>Role</dt><dd>Independent researcher</dd></div>\n                  <div><dt>Base</dt><dd>Sapporo, Japan</dd></div>'''
          new = '''                  <div><dt>Role</dt><dd>Independent researcher</dd></div>\n                  <div><dt>Native name</dt><dd lang="ja">佐藤貴士</dd></div>\n                  <div><dt>Base</dt><dd>Sapporo, Japan</dd></div>'''
          if old not in s:
              raise SystemExit('author facts anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          v = Path('tools/verify_v62.py')
          q = v.read_text(encoding='utf-8')
          old_identity = '''    for identity in ["佐藤貴士　札幌", "Sapporo", "0009-0003-1584-6965", "tN4zV68AAAAJ", "9540672"]:\n        if identity not in about:\n            fail(errors, f"about.html: identity element missing: {identity}")'''
          new_identity = '''    for identity in ["佐藤貴士", "Sapporo", "0009-0003-1584-6965", "tN4zV68AAAAJ", "9540672"]:\n        if identity not in about:\n            fail(errors, f"about.html: identity element missing: {identity}")'''
          if old_identity not in q:
              raise SystemExit('verifier identity anchor not found')
          q = q.replace(old_identity, new_identity, 1)
          old_visible = '''    if about.count('lang="ja"') != 1 or about.count("佐藤貴士　札幌") != 1:\n        fail(errors, "about.html: visible Japanese identity must be exactly one instance of 佐藤貴士　札幌")'''
          new_visible = '''    if about.count('<dd lang="ja">佐藤貴士</dd>') != 1:\n        fail(errors, "about.html: native-name identity fact must be exactly one instance")\n    if "佐藤貴士　札幌" in about:\n        fail(errors, "about.html: awkward Japanese SEO phrase returned to the visible author record")'''
          if old_visible not in q:
              raise SystemExit('verifier visible-Japanese anchor not found')
          q = q.replace(old_visible, new_visible, 1)
          v.write_text(q, encoding='utf-8')
          PY

      - name: Rebuild and verify
        run: |
          python tools/build_site.py
          python tools/verify_v62.py
          python -m compileall -q tools
          node --check assets/site.js
          test ! -e ja/index.html
          ! grep -R --line-number -E '日本語インデックス|日本語で読む|AIガバナンスを、|佐藤貴士　札幌' index.html about.html papers tools/build_site.py
          grep -n 'Native name' about.html
          grep -n '<dd lang="ja">佐藤貴士</dd>' about.html

      - name: Commit rebuilt output
        run: |
          rm -f .github/workflows/remove-visible-japanese-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove visible Japanese presentation layer'
          git push origin HEAD:fix/remove-japanese-surface
