name: Generate social identity candidate
on:
  push:
    branches:
      - social-identity-20261125
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/social-identity-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement tools/requirements.txt
      - run: python tools/generate_og.py
      - name: Commit generated social images on candidate branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate social cards from current research identity"
            git push origin HEAD:refs/heads/social-identity-20261125
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: social-card-candidate
          path: assets/og
          retention-days: 7
