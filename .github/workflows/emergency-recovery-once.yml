name: Emergency Recovery Once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Force v6.10.4 cache contract and rebuild
        run: |
          python - <<'PY'
          from pathlib import Path
          for rel in ['tools/build_site.py','tools/verify_v62.py']:
              p=Path(rel)
              s=p.read_text(encoding='utf-8').replace('ASSET_VERSION = "6.10.3"','ASSET_VERSION = "6.10.4"')
              p.write_text(s,encoding='utf-8')
          p=Path('assets/archive-v62.js')
          s=p.read_text(encoding='utf-8').replace('/styles/archive-v610.css?v=6.10.3','/styles/archive-v610.css?v=6.10.4').replace('/scripts/research-fluid.js?v=6.10.3','/scripts/research-fluid.js?v=6.10.4')
          p.write_text(s,encoding='utf-8')
          PY
          python tools/build_site.py
          rm -f .github/workflows/emergency-recovery-once.yml
      - name: Commit recovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Emergency layout recovery v6.10.4' || exit 0
          git push origin main
