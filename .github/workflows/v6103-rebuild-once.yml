name: v6.10.3 Rebuild Once

on:
  push:
    branches:
      - fix/membrane-bootstrap-v6103

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize asset contract
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('tools/build_site.py','tools/verify_v62.py'):
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              old='ASSET_VERSION = "6.10.2"'
              new='ASSET_VERSION = "6.10.3"'
              if old not in text:
                  raise SystemExit(f'{name}: expected 6.10.2 asset contract missing')
              p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Rebuild deterministic archive
        run: python tools/build_site.py
      - name: Remove one-shot workflow
        run: rm .github/workflows/v6103-rebuild-once.yml
      - name: Commit synchronized outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild archive with 6.10.3 membrane runtime"
          git push origin HEAD:fix/membrane-bootstrap-v6103
