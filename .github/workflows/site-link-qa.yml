name: Archive QA

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: archive-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install pinned verification dependencies
        run: |
          python -m pip install --requirement tools/requirements.txt
          python -m pip check

      - name: Rebuild deterministic archive outputs
        run: |
          python tools/build_site.py
          python tools/generate_og.py

      - name: Commit deterministic stylesheet on redesign branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: regenerate v7 production stylesheet"
          git push origin HEAD:${{ github.head_ref }}

      - name: Require committed generated output
        run: git diff --exit-code

      - name: Verify archive, metadata, PDFs, and assets
        run: python tools/verify_v62.py

      - name: Check Python and JavaScript syntax
        run: |
          python -m compileall -q tools
          node --check assets/site.js
