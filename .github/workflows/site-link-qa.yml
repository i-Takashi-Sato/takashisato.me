name: Site Link QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/site-link-qa.yml'

permissions:
  contents: read

jobs:
  link-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check retired and non-public routes
        run: |
          set -euo pipefail

          echo "Checking that retired Part III demo file does not exist..."
          test ! -e demo/altrion-part3.html

          echo "Checking that retired Part III demo is not publicly linked..."
          if grep -RIn --include='*.html' --include='*.xml' --include='*.css' 'demo/altrion-part3.html' . \
             | grep -v './.git/' ; then
            echo "Unexpected public reference to demo/altrion-part3.html found." >&2
            exit 1
          fi

          echo "Checking that non-public contact route is not linked..."
          if grep -RIn --include='*.html' --include='*.xml' --include='*.css' 'contact.html' . \
             | grep -v './.git/' ; then
            echo "Unexpected contact.html reference found." >&2
            exit 1
          fi

          echo "Checking that non-public business route names are not linked..."
          if grep -RIn --include='*.html' --include='*.xml' --include='*.css' -E '/services/|/samples/' . \
             | grep -v './.git/' ; then
            echo "Unexpected services/samples route reference found." >&2
            exit 1
          fi

          echo "Checking sitemap does not include retired or non-public routes..."
          if grep -nE 'demo/altrion-part3.html|services|samples|contact\.html' sitemap.xml; then
            echo "Retired/non-public route still appears in sitemap." >&2
            exit 1
          fi

      - name: Check business trace vocabulary is absent
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          forbidden = [
              'サッポロ',
              'Sapporo',
              'Sapporo Investment',
              'サッポロインベストメント',
              '業務設計室',
              'Operational Design',
              'Services',
              'Samples',
              'Contact',
              '見積',
              '料金',
              '業務手順書',
              'SOP設計',
              '業務確認',
              '管理表設計',
              '採用・教育・評価文書',
              '代表取締役',
              'Provider',
              'Supervision',
              '相談',
              '制作物',
          ]
          suffixes = {'.html', '.xml', '.css', '.json', '.js'}
          hits = []
          for path in Path('.').rglob('*'):
              if '.git' in path.parts or not path.is_file() or path.suffix not in suffixes:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for term in forbidden:
                  if term in text:
                      hits.append(f'{path}: {term}')
          if hits:
              print('\n'.join(hits))
              raise SystemExit(1)
          print('Business trace vocabulary absent from public assets.')
          PY

      - name: Check public route contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          urls = re.findall(r'<loc>(.*?)</loc>', sitemap)
          expected = [
              'https://takashisato.me/',
              'https://takashisato.me/papers/',
              'https://takashisato.me/papers/part1.html',
              'https://takashisato.me/papers/part2.html',
              'https://takashisato.me/papers/part3.html',
              'https://takashisato.me/about.html',
              'https://takashisato.me/pdf/part1.pdf',
              'https://takashisato.me/pdf/part2.pdf',
              'https://takashisato.me/pdf/part3.pdf',
              'https://takashisato.me/demo/',
              'https://takashisato.me/demo/altrion-part1.html',
              'https://takashisato.me/demo/altrion-part2.html',
          ]
          if urls != expected:
              print('Sitemap public route contract mismatch.')
              print('Actual:')
              print('\n'.join(urls))
              print('Expected:')
              print('\n'.join(expected))
              raise SystemExit(1)
          print('Public route contract OK: 9 HTML routes + 3 PDFs.')
          PY

      - name: Check core local links exist
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import re

          root = Path('.')
          pages = [p for p in root.rglob('*.html') if '.git' not in p.parts]
          missing = []
          ignored_prefixes = ('http://', 'https://', 'mailto:', 'tel:', '#', 'javascript:')

          for page in pages:
              html = page.read_text(encoding='utf-8', errors='ignore')
              for attr, link in re.findall(r'\b(href|src)=["\']([^"\']+)["\']', html):
                  if not link or link.startswith(ignored_prefixes):
                      continue
                  parsed = urlparse(link)
                  path = parsed.path
                  if not path or path.startswith(('data:', 'blob:')):
                      continue
                  if path.startswith('/'):
                      target = root / path.lstrip('/')
                  else:
                      target = (page.parent / path).resolve().relative_to(root.resolve())
                      target = root / target
                  if path.endswith('/'):
                      target = target / 'index.html'
                  if not target.exists():
                      missing.append(f'{page}: {attr}="{link}" -> {target}')

          if missing:
              print('\n'.join(missing))
              raise SystemExit(1)
          print(f'Checked {len(pages)} HTML files. No missing local href/src targets found.')
          PY
