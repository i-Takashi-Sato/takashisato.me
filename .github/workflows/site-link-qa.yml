name: Site Link QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - 'research-index.json'
      - 'pdf/*.pdf'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/site-link-qa.yml'

permissions:
  contents: read

jobs:
  link-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check retired and non-public routes
        run: |
          set -euo pipefail

          echo "Checking that retired Part III demo file does not exist..."
          test ! -e demo/altrion-part3.html

          echo "Checking that obsolete duplicate JSON-LD files do not exist..."
          test ! -e assets/ld

          echo "Checking that retired Part III demo is not publicly linked..."
          if grep -RIn --include='*.html' --include='*.xml' --include='*.css' 'demo/altrion-part3.html' . \
             | grep -v './.git/' ; then
            echo "Unexpected public reference to demo/altrion-part3.html found." >&2
            exit 1
          fi

          echo "Checking that non-public contact route is not linked..."
          if grep -RIn --include='*.html' --include='*.xml' --include='*.css' 'contact.html' . \
             | grep -v './.git/' ; then
            echo "Unexpected contact.html reference found." >&2
            exit 1
          fi

          echo "Checking that non-public business route names are not linked..."
          if grep -RIn --include='*.html' --include='*.xml' --include='*.css' -E '/services/|/samples/' . \
             | grep -v './.git/' ; then
            echo "Unexpected services/samples route reference found." >&2
            exit 1
          fi

          echo "Checking sitemap does not include retired or non-public routes..."
          if grep -nE 'demo/altrion-part3.html|services|samples|contact\.html' sitemap.xml; then
            echo "Retired/non-public route still appears in sitemap." >&2
            exit 1
          fi

      - name: Check business trace vocabulary is absent
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          forbidden = [
              'サッポロ',
              'Sapporo',
              'Sapporo Investment',
              'サッポロインベストメント',
              '業務設計室',
              'Operational Design',
              'Services',
              'Samples',
              'Contact',
              '見積',
              '料金',
              '業務手順書',
              'SOP設計',
              '業務確認',
              '管理表設計',
              '採用・教育・評価文書',
              '代表取締役',
              'Provider',
              'Supervision',
              '相談',
              '制作物',
          ]
          suffixes = {'.html', '.xml', '.css', '.json', '.js'}
          hits = []
          for path in Path('.').rglob('*'):
              if (
                  '.git' in path.parts
                  or 'vendor' in path.parts
                  or path.name == 'privacy.html'
                  or not path.is_file()
                  or path.suffix not in suffixes
              ):
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              for term in forbidden:
                  if term in text:
                      hits.append(f'{path}: {term}')
          if hits:
              print('\n'.join(hits))
              raise SystemExit(1)
          print('Business trace vocabulary absent from public assets.')
          PY

      - name: Check public route contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          urls = re.findall(r'<loc>(.*?)</loc>', sitemap)
          expected = [
              'https://takashisato.me/',
              'https://takashisato.me/papers/',
              'https://takashisato.me/papers/part1.html',
              'https://takashisato.me/papers/part2.html',
              'https://takashisato.me/papers/part3.html',
              'https://takashisato.me/about.html',
              'https://takashisato.me/pdf/part1.pdf',
              'https://takashisato.me/pdf/part2.pdf',
              'https://takashisato.me/pdf/part3.pdf',
              'https://takashisato.me/demo/',
              'https://takashisato.me/demo/altrion-part1.html',
              'https://takashisato.me/demo/altrion-part2.html',
          ]
          if urls != expected:
              print('Sitemap public route contract mismatch.')
              print('Actual:')
              print('\n'.join(urls))
              print('Expected:')
              print('\n'.join(expected))
              raise SystemExit(1)
          print('Public route contract OK: 9 HTML routes + 3 PDFs.')
          PY

      - name: Check metadata contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          pages = [
              'index.html',
              'papers/index.html',
              'papers/part1.html',
              'papers/part2.html',
              'papers/part3.html',
              'about.html',
              'demo/index.html',
              'demo/altrion-part1.html',
              'demo/altrion-part2.html',
          ]
          required = [
              r'<title>.+?</title>',
              r'<meta\s+name="description"\s+content="[^"]+"\s*/?>',
              r'<link\s+rel="canonical"\s+href="https://takashisato\.me/[^"]*"\s*/?>',
              r'<meta\s+property="og:title"\s+content="[^"]+"\s*/?>',
              r'<meta\s+property="og:description"\s+content="[^"]+"\s*/?>',
              r'<meta\s+property="og:image"\s+content="https://takashisato\.me/assets/og/[^"]+"\s*/?>',
              r'<meta\s+name="twitter:card"\s+content="summary_large_image"\s*/?>',
              r'<meta\s+name="twitter:image"\s+content="https://takashisato\.me/assets/og/[^"]+"\s*/?>',
          ]
          misses = []
          for page in pages:
              html = Path(page).read_text(encoding='utf-8', errors='ignore')
              for pattern in required:
                  if not re.search(pattern, html, flags=re.I|re.S):
                      misses.append(f'{page}: missing {pattern}')
          if misses:
              print('\n'.join(misses))
              raise SystemExit(1)
          print('Metadata contract OK for research archive pages.')
          PY

      - name: Check research record integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          import re

          expected = [
              {
                  'part': 1,
                  'title': 'Workflow-Centric AI Governance: A Sociotechnical Architecture for Accountable Human–AI Decision Systems',
                  'year': '2025',
                  'doi': '10.2139/ssrn.5911063',
                  'ssrn': '5911063',
              },
              {
                  'part': 2,
                  'title': 'Forecasting Failure: Why Structurally Sound AI Governance Collapses Before It Is Abused',
                  'year': '2025',
                  'doi': '10.2139/ssrn.5913703',
                  'ssrn': '5913703',
              },
              {
                  'part': 3,
                  'title': 'Detecting Silent Governance Failure: Semantic Entropy, Dissent Exhaustion, and Circuit Breakers',
                  'year': '2026',
                  'doi': '10.2139/ssrn.6066430',
                  'ssrn': '6066430',
              },
          ]

          index = json.loads(Path('research-index.json').read_text(encoding='utf-8'))
          assert index['@type'] == 'CreativeWorkSeries'
          assert index['@id'] == 'https://takashisato.me/research-index.json#series'
          assert 'dataset' not in index
          assert len(index['hasPart']) == 3

          for record, item in zip(expected, index['hasPart']):
              part = record['part']
              html_path = Path(f'papers/part{part}.html')
              pdf_path = Path(f'pdf/part{part}.pdf')
              html = html_path.read_text(encoding='utf-8')

              tag_expectations = {
                  'citation_title': record['title'],
                  'citation_author': 'Takashi Sato',
                  'citation_publication_date': record['year'],
                  'citation_doi': record['doi'],
              }
              for name, value in tag_expectations.items():
                  values = re.findall(
                      rf'<meta\s+name="{name}"\s+content="([^"]*)"\s*/?>',
                      html,
                      flags=re.I,
                  )
                  assert values == [value], f'{html_path}: invalid {name}: {values}'

              visible_record = f'Research Record 00{part}'
              assert html.count(visible_record) == 1, f'{html_path}: missing visible research record'
              assert html.count(f'href="https://doi.org/{record["doi"]}"') == 1, f'{html_path}: invalid visible DOI link'
              assert html.count('href="https://orcid.org/0009-0003-1584-6965"') == 1, f'{html_path}: invalid visible ORCID link'

              match = re.search(
                  r'<script type="application/ld\+json">\s*(.*?)\s*</script>',
                  html,
                  flags=re.S,
              )
              assert match, f'{html_path}: missing JSON-LD'
              article = json.loads(match.group(1))

              assert item['position'] == part
              assert article['@id'] == item['@id']
              assert article['name'] == item['name'] == record['title']
              assert article['inLanguage'] == item['inLanguage'] == 'en'
              assert article['isPartOf']['@id'] == index['@id']

              article_ids = {entry['propertyID']: entry for entry in article['identifier']}
              item_ids = {entry['propertyID']: entry for entry in item['identifier']}
              for identifiers in (article_ids, item_ids):
                  assert identifiers['DOI']['value'] == record['doi']
                  assert identifiers['SSRN']['value'] == record['ssrn']

              pdf_bytes = pdf_path.read_bytes()
              size = f'{len(pdf_bytes)} bytes'
              digest = sha256(pdf_bytes).hexdigest()
              for encoding in (article['encoding'], item['encoding']):
                  assert encoding['contentUrl'] == f'https://takashisato.me/pdf/part{part}.pdf'
                  assert encoding['encodingFormat'] == 'application/pdf'
                  assert encoding['contentSize'] == size
                  assert encoding['sha256'] == digest

          print('Research record integrity OK: 3 papers, 3 PDFs, identifiers and hashes aligned.')
          PY

      - name: Check core local links exist
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import re

          root = Path('.')
          pages = [p for p in root.rglob('*.html') if '.git' not in p.parts]
          missing = []
          ignored_prefixes = ('http://', 'https://', 'mailto:', 'tel:', '#', 'javascript:')

          for page in pages:
              html = page.read_text(encoding='utf-8', errors='ignore')
              for attr, link in re.findall(r'\b(href|src)=["\']([^"\']+)["\']', html):
                  if not link or link.startswith(ignored_prefixes):
                      continue
                  parsed = urlparse(link)
                  path = parsed.path
                  if not path or path.startswith(('data:', 'blob:')):
                      continue
                  if path.startswith('/'):
                      target = root / path.lstrip('/')
                  else:
                      target = (page.parent / path).resolve().relative_to(root.resolve())
                      target = root / target
                  if path.endswith('/'):
                      target = target / 'index.html'
                  if not target.exists():
                      missing.append(f'{page}: {attr}="{link}" -> {target}')

          if missing:
              print('\n'.join(missing))
              raise SystemExit(1)
          print(f'Checked {len(pages)} HTML files. No missing local href/src targets found.')
          PY
