name: Live Release Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: live-release-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify public HTTPS responses and release bytes
        run: python3 tools/verify_live.py --attempts 16 --interval 15
