name: One-shot v6.14 CSS load sync

on:
  push:
    branches:
      - feat/final-architecture-seo-art

permissions:
  contents: write

concurrency:
  group: v614-css-load-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/final-architecture-seo-art
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python -m pip install --requirement tools/requirements.txt
      - name: Make the shared stylesheet active during initial render
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/archive/layout.py')
          text = path.read_text(encoding='utf-8')
          old = '''          <link rel="preload" href="/assets/site.css?v={ASSET_VERSION}" as="style">
          <link rel="stylesheet" href="/assets/site.css?v={ASSET_VERSION}" media="print" data-full-style>
          <style data-critical>{critical_css}</style>
          <noscript><link rel="stylesheet" href="/assets/site.css?v={ASSET_VERSION}"></noscript>'''
          new = '''          <link rel="preload" href="/assets/site.css?v={ASSET_VERSION}" as="style">
          <link rel="stylesheet" href="/assets/site.css?v={ASSET_VERSION}">
          <style data-critical>{critical_css}</style>'''
          if old not in text:
              raise SystemExit('stylesheet contract not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python tools/build_site.py
          python tools/generate_og.py
          python tools/verify_v62.py
          node --check assets/site.js
      - name: Commit synchronized source and output
        run: |
          rm -f .github/workflows/v614-css-load-sync-once.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: activate archive stylesheet during initial render'
          git push origin HEAD:feat/final-architecture-seo-art
