name: PR CSP Browser Audit

on:
  push:
    branches:
      - v6.18.1-csp-critical-css

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v6.18.1-csp-critical-css
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium webkit
      - name: Serve branch with production-equivalent CSP and test browsers
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/server.py <<'PY'
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer

          CSP = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests;"

          class Handler(SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header('Content-Security-Policy', CSP)
                  self.send_header('X-Content-Type-Options', 'nosniff')
                  super().end_headers()

          ThreadingHTTPServer(('127.0.0.1', 4173), Handler).serve_forever()
          PY
          python /tmp/server.py >/tmp/server.log 2>&1 &
          echo $! >/tmp/server.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done

          python - <<'PY'
          from playwright.sync_api import sync_playwright
          ROUTES = ['/', '/papers/', '/papers/part1.html', '/papers/part2.html', '/papers/part3.html', '/about.html']
          PROFILES = [
              ('chromium-desktop', 'chromium', {'width':1440,'height':1000}, 'no-preference'),
              ('chromium-mobile', 'chromium', {'width':390,'height':844}, 'no-preference'),
              ('webkit-desktop', 'webkit', {'width':1440,'height':1000}, 'no-preference'),
              ('webkit-mobile', 'webkit', {'width':390,'height':844}, 'no-preference'),
              ('webkit-mobile-reduced', 'webkit', {'width':390,'height':844}, 'reduce'),
          ]
          failures=[]
          with sync_playwright() as p:
              for label, engine, viewport, reduced in PROFILES:
                  browser=getattr(p,engine).launch()
                  context=browser.new_context(viewport=viewport,reduced_motion=reduced)
                  for route in ROUTES:
                      page=context.new_page(); errors=[]
                      page.on('pageerror', lambda exc, errors=errors: errors.append(f'pageerror: {exc}'))
                      page.on('console', lambda msg, errors=errors: errors.append(f'console error: {msg.text}') if msg.type=='error' else None)
                      try:
                          response=page.goto('http://127.0.0.1:4173'+route,wait_until='networkidle',timeout=45000)
                          if not response or response.status != 200: failures.append(f'{label} {route}: HTTP {response.status if response else 0}')
                          page.locator('h1').first.wait_for(state='visible',timeout=10000)
                          m=page.evaluate("() => ({w:innerWidth, sw:document.documentElement.scrollWidth, bw:document.body.scrollWidth})")
                          if max(m['sw'],m['bw'])-m['w'] > 1: failures.append(f"{label} {route}: horizontal overflow")
                          if errors: failures.append(f"{label} {route}: {' | '.join(errors)}")
                          if route == '/papers/part3.html':
                              page.evaluate('window.scrollTo(0, document.documentElement.scrollHeight)'); page.wait_for_timeout(500)
                              if reduced == 'reduce' and page.locator('.series-nav').count():
                                  nav=page.locator('.series-nav').first
                                  t=nav.evaluate("el=>getComputedStyle(el).transform"); o=float(nav.evaluate("el=>getComputedStyle(el).opacity"))
                                  if t not in ('none','matrix(1, 0, 0, 1, 0, 0)') or abs(o-1)>0.01: failures.append(f'{label} Part III reduced-motion mutation: {t}, {o}')
                          print('PASS',label,route)
                      except Exception as exc:
                          failures.append(f'{label} {route}: {exc}')
                      finally: page.close()
                  context.close(); browser.close()
          if failures:
              print('\n'.join('FAIL '+x for x in failures)); raise SystemExit(1)
          print('CSP-clean browser audit PASSED.')
          PY
