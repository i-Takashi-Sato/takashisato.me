name: Finish v6.13 editorial refinement

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: v613-finish-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  finish:
    if: github.head_ref == 'design/editorial-refinement-v613' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out design branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/editorial-refinement-v613
          fetch-depth: 0

      - name: Require finish trigger
        id: trigger
        run: |
          if [ -f docs/.v613-finish-trigger ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.trigger.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install verification dependencies
        if: steps.trigger.outputs.run == 'true'
        run: python -m pip install --requirement tools/requirements.txt

      - name: Remove paint overflow and render-blocking material requests
        if: steps.trigger.outputs.run == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          build_path = root / 'tools/build_site.py'
          css_path = root / 'assets/site.css'
          b = build_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          preload = '          <link rel="preload" href="/assets/fonts/MeaCulpa.woff2" as="font" type="font/woff2" crossorigin>\n'
          if preload in b:
              b = b.replace(preload, '', 1)

          old_script = '          <script src="/assets/site.js?v={ASSET_VERSION}"></script>'
          new_script = '          <script src="/assets/site.js?v={ASSET_VERSION}" defer></script>'
          assert old_script in b
          b = b.replace(old_script, new_script, 1)

          marker = '/* v6.13.1 — Raster-free material finish. */'
          assert marker not in css
          css += r'''

/* v6.13.1 — Raster-free material finish.
   Materiality is generated from state rules and light, not wallpaper textures. */
body::before {
  background:
    repeating-linear-gradient(180deg, rgba(255,255,255,.026) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 7px);
  mix-blend-mode: soft-light;
  opacity: .15;
}

.hero::after,
.page-hero::before,
.author-hero::before,
.paper-hero::before {
  background:
    radial-gradient(84% 120% at 96% 18%, var(--signal-wash), transparent 62%),
    linear-gradient(90deg, rgba(8,8,8,.96) 0%, rgba(8,8,8,.46) 54%, rgba(8,8,8,.91) 100%);
  opacity: .58;
}

.paper-meta {
  background:
    linear-gradient(90deg, rgba(255,255,255,.022), transparent 42%),
    rgba(8,8,8,.72);
}
.boundary {
  background:
    linear-gradient(112deg, rgba(255,255,255,.026), transparent 38%),
    rgba(10,10,11,.88);
}
.model {
  background:
    linear-gradient(rgba(10,10,10,.82), rgba(10,10,10,.91)),
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: auto, 2rem 2rem, 2rem 2rem;
}
.citation {
  background: linear-gradient(100deg, rgba(255,255,255,.022), transparent 58%), rgba(8,8,8,.88);
}
.notice {
  background: linear-gradient(110deg, rgba(255,255,255,.026), transparent 52%), rgba(8,8,8,.88);
}
.site-footer {
  background:
    radial-gradient(80% 90% at 50% 0, var(--signal-wash), transparent 68%),
    linear-gradient(180deg, #080808, #050505);
}

/* The hidden author-link signature must never enlarge the mobile canvas. */
body[data-page="about"] .author-links { overflow: clip; }
@media (max-width:44rem) {
  body[data-page="about"] .author-links::before { left: 0; right: 0; }
}
'''

          build_path.write_text(b, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Rebuild and verify
        if: steps.trigger.outputs.run == 'true'
        run: |
          python tools/build_site.py
          python tools/generate_og.py
          python tools/verify_v62.py
          python -m compileall -q tools
          node --check assets/site.js
          ! grep -R --line-number -E 'content:[[:space:]]*"(序|破|急)"|Jo / Ha / Kyu' assets/site.css
          grep -R --line-number 'site.js?v=6.13.0" defer' index.html papers/index.html papers/part1.html papers/part2.html papers/part3.html about.html

      - name: Commit final v6.13 output
        if: steps.trigger.outputs.run == 'true'
        run: |
          rm -f docs/.v613-finish-trigger .github/workflows/v613-finish-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish v6.13 material and performance pass'
          git push origin HEAD:design/editorial-refinement-v613
