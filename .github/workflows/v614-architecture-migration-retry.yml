name: One-shot v6.14 architecture migration retry

on:
  push:
    branches:
      - feat/final-architecture-seo-art

permissions:
  contents: write

concurrency:
  group: v614-architecture-migration-retry
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/final-architecture-seo-art
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Install pinned verification dependencies
        run: python -m pip install --requirement tools/requirements.txt

      - name: Repair and migrate source architecture
        run: |
          python tools/fix_v614_migration.py
          python tools/migrate_v614_architecture.py

      - name: Build archive and social records
        run: |
          python tools/build_site.py
          python tools/generate_og.py

      - name: Verify release candidate
        run: |
          python tools/verify_v62.py
          python -m compileall -q tools src
          node --check assets/site.js
          ! grep -R --line-number -E 'content:[[:space:]]*"(序|破|急)"' assets/site.css assets/critical.css
          ! grep -R --line-number '/assets/materials/' assets/site.css assets/critical.css assets/site.js

      - name: Commit migrated archive
        run: |
          rm -f tools/migrate_v614_architecture.py tools/fix_v614_migration.py
          rm -f .github/workflows/v614-architecture-migration-once.yml
          rm -f .github/workflows/v614-architecture-migration-retry.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v6.14: unify architecture, entity graph, and pavilion grammar'
          git push origin HEAD:feat/final-architecture-seo-art
