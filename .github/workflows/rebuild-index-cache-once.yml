name: Rebuild Index Cache Once

on:
  push:
    branches:
      - fix/asset-cache-v6101

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/build_site.py
      - run: rm .github/workflows/rebuild-index-cache-once.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Finalize 6.10.2 deterministic cache keys" && git push origin HEAD:fix/asset-cache-v6101)
