name: v6.16 Branch Build

on:
  push:
    branches:
      - v6.16-advanced-pavilion
    paths:
      - 'src/**'
      - 'tools/build_assets.py'
      - 'tools/build_site.py'
      - 'tools/generate_og.py'

permissions:
  contents: write

concurrency:
  group: v616-generated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-generated-output:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v6.16-advanced-pavilion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install pinned build dependencies
        run: python -m pip install --requirement tools/requirements.txt

      - name: Rebuild deterministic outputs
        run: |
          python tools/build_site.py
          python tools/generate_og.py

      - name: Commit generated output when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Generated output already reconciled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/site.css assets/site.js assets/critical.css assets/og \
            index.html about.html colophon.html privacy.html security.html 404.html \
            papers demo research-index.json sitemap.xml robots.txt llms.txt humans.txt \
            site.webmanifest .well-known/security.txt
          git commit -m 'build: reconcile v6.16 generated archive output'
          git push origin HEAD:v6.16-advanced-pavilion
