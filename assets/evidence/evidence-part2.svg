<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="none"><defs><filter id="grain"><feTurbulence baseFrequency="0.72" numOctaves="3" seed="220"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .17"/></feComponentTransfer></filter><linearGradient id="burn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#050607" stop-opacity=".1"/><stop offset=".34" stop-color="#c45c50" stop-opacity=".085"/><stop offset=".62" stop-color="#b7aa91" stop-opacity=".075"/><stop offset="1" stop-color="#050607" stop-opacity=".18"/></linearGradient><radialGradient id="glow" cx="70%" cy="48%" r="52%"><stop offset="0" stop-color="#c45c50" stop-opacity=".11"/><stop offset="1" stop-color="#050607" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="420" fill="#050607"/><rect width="1600" height="420" filter="url(#grain)"/><rect x="74" y="58" width="1452" height="304" fill="url(#burn)" stroke="#f2f2ec" stroke-opacity=".105"/><rect x="74" y="58" width="1452" height="304" fill="url(#glow)"/><g fill="none" stroke="#f2f2ec" stroke-opacity=".065"><path d="M120 126h1360M120 188h1360M120 250h1360M120 312h1360"/><path d="M440 58v304M800 58v304M1160 58v304"/></g><g font-family="Georgia, 'Times New Roman', serif"><text x="120" y="118" fill="#f2f2ec" fill-opacity=".70" font-size="32">EXTRACT / PART II</text><text x="120" y="184" fill="#f2f2ec" fill-opacity=".55" font-size="25">Organizational entropy does not announce itself.</text><text x="120" y="232" fill="#f2f2ec" fill-opacity=".40" font-size="22">It converts review into routine, dissent into silence, and exceptions into speed bumps.</text><text x="120" y="292" fill="#f2f2ec" fill-opacity=".34" font-size="22">Good-faith operation can still destroy oversight.</text></g><g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2" text-transform="uppercase"><text x="480" y="120" fill="#b7aa91" font-size="15">Cognitive Externalization</text><text x="840" y="120" fill="#b7aa91" font-size="15">Responsibility Inversion</text><text x="1200" y="120" fill="#b7aa91" font-size="15">Legibility Capture</text><text x="480" y="252" fill="#f2f2ec" fill-opacity=".32" font-size="14">Why we do this → how to click</text><text x="840" y="252" fill="#f2f2ec" fill-opacity=".32" font-size="14">Accountable for outputs no one determines</text><text x="1200" y="252" fill="#f2f2ec" fill-opacity=".32" font-size="14">The map replaces the territory</text></g></svg>